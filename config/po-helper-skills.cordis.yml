# po-helper skills (.claude/skills/) as a native DSH skill root, through
# @deepseek-ai/dsh-skill-filesystem (already registered by the base bundle
# under id "skill-filesystem" — see packages/bundle/base/cordis.patch.yml in
# the harness-ui checkout). This is a config PATCH on that existing entry
# (bare id-matched object, not wrapped in `insert` — `insert` is only for
# NEW entries; see vendor/loader/src/config/entry.ts EntryOptions and
# packages/boot/app-boot/tests/user-patches.spec.ts for the distinction),
# so it must NOT be wrapped in `insert:`.
#
# customSkillDirs makes every skill under ishmanov-cortex/.claude/skills
# (sprint-planner, bft-writer, okr-planner, daily-review, ...) invocable as
# skill({name}) in the dsh chat, using the exact <name>/SKILL.md bundles
# already on disk — no rewrite.
#
# Local to this workspace only — this file lives under
# ishmanov-cortex/harness-ui-ops/, not the global ~/.dsh. Merge the row
# below into
#   ishmanov-cortex/harness-ui/.dsh-data/profiles/web/cordis.patch.yml
#
# dsh-web-app disables both skill-filesystem and tool-skill by default in
# this profile (confirmed via `dsh --profile web --dump-config`) — without
# re-enabling them explicitly here, customSkillDirs is set but inert and the
# model-facing `skill` tool itself does not exist.
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  disabled: false
  config:
    customSkillDirs:
      - '<ваш-рабочий-каталог>/.claude/skills'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
  disabled: false

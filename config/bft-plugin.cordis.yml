# Раздел «Управление требованиями» (dsh-plugin-bft) в профиле web.
#
# Пакет: ../../harness-ui-plugins/dsh-plugin-bft (наш код, kibarik/mts-po-workspace).
# Плагин — бандл: его собственный cordis.patch.yml вставляет строку с умолчаниями,
# а здесь задокументирован слой профиля, который добавляет обязательный путь.
#
# Применено локально двумя правками (штатная `dsh plugin add` сломана — issue #37
# kibarik/mts-po-workspace: рапортует успех, но манифест профиля не меняет):
#   1. .dsh-data/profiles/web/package.json:
#        dependencies["dsh-plugin-bft"] = "link:<путь к пакету>"
#        dsh.profile.bundles += "dsh-plugin-bft"
#      затем `pnpm install` в каталоге профиля.
#   2. .dsh-data/profiles/web/cordis.patch.yml — строка ниже.
#
# Секретов здесь нет и быть не должно. Токены JIRA/Confluence плагин читает из
# окружения процесса харнесса; без них раздел работает, показывая ссылки.
# После установки/обновления плагина — перезапустить dsh web (см. ../RUNNING.md).
- id: bft-requirements
  config:
    workspaceRoot: '<ваш-рабочий-каталог>'

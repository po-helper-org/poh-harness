# Context7 (https://context7.com) as a native DSH tool server, through the
# generic MCP bridge (@deepseek-ai/dsh-mcp-client) that already ships in this
# checkout — no custom plugin needed.
#
# Context7 serves up-to-date library/framework documentation and code examples.
# The hosted endpoint speaks Streamable HTTP and answered an `initialize`
# handshake from this machine anonymously (server "Context7" v4.0.4), so no
# account or API key is required for the default rate limit. It exposes
# resolve-library-id and the documentation query tool, which reach the model as
# mcp__context7__<tool>.
#
# Transport note: this is `streamable-http`, so DSH only connects — there is no
# child process to install or supervise, unlike the stdio backlog row. If the
# endpoint is unreachable at startup the harness still boots and simply lists no
# context7 tools (failOnStartupError stays at its default false).
#
# Optional: a Context7 account raises rate limits. To use one, set CONTEXT7_API_KEY
# in the environment that launches DSH and uncomment the `headers` block below —
# never paste the literal key into this file.
#
# Local to this workspace only — this file lives under
# ishmanov-cortex/harness-ui-ops/, not the global ~/.dsh. Merge the `insert` row
# below into
#   ishmanov-cortex/harness-ui/.dsh-data/profiles/web/cordis.patch.yml
- insert:
    - id: context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: 'https://mcp.context7.com/mcp'
        headers: {}
        # headers:
        #   Authorization: !!js '`Bearer ${process.env.CONTEXT7_API_KEY}`'

name: leak-check

# Репозиторий публичный: каждый PR проверяется на рабочие данные и секреты
# тем же скриптом, что и локальный pre-commit хук.
on:
  pull_request:

permissions:
  contents: read

jobs:
  leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: scripts/check-leaks.sh
        run: scripts/check-leaks.sh "origin/${{ github.base_ref }}...HEAD"

# Раздел «Управление требованиями»: очередь БФТ из Backlog.md, документы и доска.
#
# Этот файл едет вместе с пакетом и применяется на любой машине, поэтому путей
# конкретного компьютера здесь нет. Обязательный workspaceRoot задаётся слоем
# профиля — точечной правкой конфигурации по идентификатору `bft-requirements`:
#
#   - id: bft-requirements
#     config:
#       workspaceRoot: '/путь/к/воркспейсу'
#
# Пока он не задан, плагин поднимется и сразу скажет, чего ему не хватает.
#
# Секретов здесь быть не должно: файл лежит в репозитории. Токены JIRA и
# Confluence плагин читает из окружения процесса харнесса.
- insert:
    - id: bft-requirements
      name: dsh-plugin-bft
      config:
        backlogBin: backlog
        docsPath: bft/documentation
        indexPath: bft/index
        # Рабочее пространство по умолчанию для работы с требованиями: каталог (внутри
        # workspaceRoot), к которому привязываются все чаты по БФТ — мини-чат детальной
        # страницы заводит сессию здесь, а не в текущем рабочем пространстве харнесса.
        # Агент стартует там же, где лежат documentation/ и index/, а диалоги по
        # требованиям собираются отдельной группой. Пустая строка выключает привязку.
        sessionPath: bft
        taskType: bft
        # Название команды — только диагностическая метка (см. README), не
        # влияет на поведение. Задайте своё через BFT_TEAM_NAME или здесь.
        teamName: PO team

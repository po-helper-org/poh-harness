# Мобильный скин poh-harness: CSS-адаптация под узкий экран.
#
# Плагин не имеет серверной части и конфигурации — только браузерная половина,
# которая вставляет <style data-plugin="poh-mobile-skin"> с media-правилами.
# Файл едет вместе с пакетом, машинных путей и секретов здесь нет.
- insert:
    - id: poh-mobile-skin
      name: poh-mobile-skin
      config: {}

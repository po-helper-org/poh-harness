<!doctype html>
<html lang="ru" data-ds-dark-theme>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>poh-mobile-skin fixture</title>
<!--
  Стенд мобильного скина. Запуск: pnpm stand (test/stand.mjs) — отдаёт эту
  страницу, dsh.css (реальный CSS dsh из node_modules) и client.js (собранный
  скин). Разметка ниже повторяет dsh 0.1.7-rc.2: AppFrame (ui-layout),
  SidebarRoot (ui-sidebar), ConversationRoot (ui-conversation),
  SettingsRoot (ui-settings-general), WorkspaceBrowser (ui-workspace).
  При обновлении dsh сверяйте разметку и классы с новыми пакетами.
-->

<link rel="stylesheet" href="dsh.css">
<style>
  :root {
    --dsw-alias-bg-base:#141416; --dsw-alias-bg-layer-2:#232326; --dsw-alias-bg-l2:#1c1c1f;
    --dsw-specific-sidebar-fill:#1b1b1d; --dsw-alias-label-primary:#eee; --dsw-alias-label-secondary:#aaa;
    --dsw-alias-label-tertiary:#888; --dsw-alias-border-l2:rgba(255,255,255,.1); --dsw-alias-border-l3:rgba(255,255,255,.08);
    --dsw-radius-md:8px; --dsw-radius-panel:16px; --dsw-alias-state-business-primary:#6b8cff;
    color-scheme: dark;
  }
  html, body { margin:0; height:100%; background:#141416; color:#eee; font-family:-apple-system, system-ui, sans-serif; }
  #app { height:100%; }
  #report { position:fixed; z-index:5000; left:0; right:0; bottom:0; max-height:45%; overflow:auto; margin:0;
            background:rgba(0,0,0,.92); color:#9f9; font:11px/1.35 ui-monospace, monospace; padding:6px; display:none; }
  body.show-report #report { display:block; }
  .fx-swatch { display:flex; gap:8px; }
  .fx-swatch > div { flex:1; border:1px solid #444; border-radius:12px; padding:18px 8px; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <div class="pI_x6G_frame" data-sidebar-collapsed style="grid-template-columns:56px minmax(0px, 1fr) minmax(0px, 0px)">
    <div class="pI_x6G_sidebarCol">
      <div class="hHd-Xa_root hHd-Xa_collapsed" id="sidebarRoot">
        <button class="hHd-Xa_iconButton hHd-Xa_toggle" id="nativeToggle" type="button" aria-label="toggle">⟷</button>
        <button class="hHd-Xa_newSession" id="newSession" type="button">＋ <span class="hHd-Xa_newSessionLabel">Новая сессия</span></button>
        <div class="hHd-Xa_regionArea" id="sessions">
          <div class="bhn1Oq_sectionHeader">Workspaces <button type="button" id="wsSearch">🔍</button></div>
          <div role="treeitem" aria-expanded="true" id="wsGroup">▾ demo-workspace</div>
          <button type="button" data-session-link="s1">Чат 1 — план спринта</button>
          <button type="button" data-session-link="s2">Чат 2 — БФТ</button>
        </div>
        <div class="hHd-Xa_footArea">
          <div class="hHd-Xa_footerActions">
            <button type="button" data-plugin-btn="bft">☑ <span class="lbl">Требования</span></button>
            <button type="button" data-plugin-btn="comm">💬 <span class="lbl">Общение</span></button>
          </div>
          <div class="hHd-Xa_settingsArea">
            <button type="button" id="openSettings" class="VOzbGW_trigger">⚙ <span class="VOzbGW_triggerLabel">Settings</span></button>
          </div>
        </div>
      </div>
    </div>
    <div class="pI_x6G_centerCol">
      <div class="wSkVaW_root" data-phase="hero">
        <div class="wSkVaW_header wSkVaW_headerBlank"></div>
        <div class="wSkVaW_body" data-conversation-content data-content-phase="hero" data-conversation-session="">
          <div class="wSkVaW_scrollBody" data-conversation-scroll>
            <div class="wSkVaW_composerSeat" data-composer-seat>
              <div class="wSkVaW_composerStack wSkVaW_composerHero">
                <div class="pXSMma_root"><div class="pXSMma_stack"><div class="pXSMma_headline">🐋 Чем займёмся?</div></div></div>
                <div style="border:1px solid #333;border-radius:20px;padding:14px;background:#1c1c1f">
                  <div data-composer-input contenteditable="true" role="textbox" style="min-height:24px;font-size:14px;outline:none">Сообщение…</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="pI_x6G_rightbarCol" data-rightbar-col></div>
    <div class="pI_x6G_overlayLayer" data-shell-overlay></div>
  </div>
</div>
<pre id="report"></pre>

<script>
// ── Модель dsh: переключатель сайдбара и модалка настроек (как SettingsRoot 0.1.7-rc.2) ──
const frame = document.querySelector('.pI_x6G_frame')
const sidebarRoot = document.getElementById('sidebarRoot')
let nativeToggleClicks = 0
document.getElementById('nativeToggle').addEventListener('click', () => {
  nativeToggleClicks++
  const collapsed = frame.hasAttribute('data-sidebar-collapsed')
  if (collapsed) { frame.removeAttribute('data-sidebar-collapsed'); sidebarRoot.classList.remove('hHd-Xa_collapsed') }
  else { frame.setAttribute('data-sidebar-collapsed', ''); sidebarRoot.classList.add('hHd-Xa_collapsed') }
})
document.querySelectorAll('[data-session-link]').forEach(b => b.addEventListener('click', () => {
  document.querySelector('[data-conversation-session]').setAttribute('data-conversation-session', b.dataset.sessionLink)
}))
document.getElementById('newSession').addEventListener('click', () => {
  document.querySelector('[data-conversation-session]').setAttribute('data-conversation-session', 'new-' + Date.now())
})
document.querySelectorAll('[data-plugin-btn]').forEach(b => b.addEventListener('click', () => {
  const p = document.createElement('div'); p.textContent = 'panel ' + b.dataset.pluginBtn
  document.querySelector('[data-shell-overlay]').appendChild(p)
}))

const SECTIONS = [
  { id: 'general', label: 'General' },
  { id: 'models', label: 'Models' },
  { id: 'builtin', label: 'Built-in plugins' },
  { id: 'presets', label: 'Agent presets' },
  { id: 'subscriptions', label: 'Subscriptions' },
]
function sectionBody(id) {
  const row = (t, d, ctl) => `<div class="Pt1bsG_row"><div><div class="Pt1bsG_title">${t}</div>${d ? `<div class="Pt1bsG_description">${d}</div>` : ''}</div><div>${ctl}</div></div>`
  const sel = v => `<button style="height:36px;padding:0 14px;border-radius:8px;border:0;background:#2a2a2e;color:#eee;min-width:160px;text-align:left">${v} ▾</button>`
  switch (id) {
    case 'general': return row('Language', '', sel('English')) +
      `<div class="yIbyla_row">Appearance<div class="fx-swatch"><div>☀ Light</div><div>☾ Dark</div><div>▭ System</div></div></div>` +
      row('Font size', 'Only affects conversation content', sel('14')) + row('Work details', 'Choose what the agent shows while it works', sel('Normal'))
    case 'models': return row('Default model', 'Used for new sessions', sel('glm-5.3')) + row('Fast model', '', sel('glm-5.3-flash'))
    case 'builtin': return row('Web search', 'Search the web from sessions', sel('On')) + row('Terminal', '', sel('On'))
    case 'presets': return row('Preset: PO helper', 'poh-helper skills', sel('Edit')) + `<table><tr><td>very_long_cell_that_should_scroll_inside_table_instead_of_page_______________________</td></tr></table>`
    case 'subscriptions': return row('ChatGPT (Codex)', 'OAuth', sel('Connect')) + row('Claude', 'OAuth', sel('Connect'))
  }
}
let settings = null
const REMOUNT = new URLSearchParams(location.search).has('remount')
function renderSettings(activeId) {
  // По умолчанию как React: узел панели живёт, меняются класс active и
  // содержимое options. ?remount — худший случай: портал пересоздаётся.
  if (settings && !REMOUNT) {
    settings.querySelectorAll('.VOzbGW_navCell').forEach(c => c.classList.toggle('VOzbGW_active', c.dataset.id === activeId))
    const o = settings.querySelector('.VOzbGW_options')
    o.dataset.activeSection = activeId
    o.innerHTML = sectionBody(activeId)
    return
  }
  if (settings) settings.remove()
  settings = document.createElement('div')
  settings.className = 'VOzbGW_overlay'
  settings.innerHTML = `<div class="VOzbGW_mask"></div>
    <div class="VOzbGW_panel" role="dialog" aria-modal="true" tabindex="-1">
      <nav class="VOzbGW_nav"><div class="VOzbGW_navTitle">Settings</div><div class="VOzbGW_navList">${
        SECTIONS.map(s => `<button type="button" data-id="${s.id}" class="VOzbGW_navCell${s.id === activeId ? ' VOzbGW_active' : ''}"><span class="VOzbGW_navIcon">◎</span><span class="VOzbGW_navLabel">${s.label}</span></button>`).join('')
      }</div></nav>
      <div class="VOzbGW_content">
        <div class="VOzbGW_header"><div class="VOzbGW_actions"></div><button type="button" class="VOzbGW_close" aria-label="close">✕</button></div>
        <div class="VOzbGW_options" data-active-section="${activeId}">${sectionBody(activeId)}</div>
      </div>
    </div>`
  settings.querySelector('.VOzbGW_mask').onclick = closeSettings
  settings.querySelector('.VOzbGW_close').onclick = closeSettings
  settings.querySelectorAll('.VOzbGW_navCell').forEach(c => c.onclick = () => renderSettings(c.dataset.id))
  document.body.appendChild(settings)
}
function closeSettings() { settings?.remove(); settings = null }
document.getElementById('openSettings').addEventListener('click', () => renderSettings('general'))

// Скрытая вкладка не крутит rAF — для стенда подменяем таймером.
window.requestAnimationFrame = cb => setTimeout(() => cb(performance.now()), 16)
window.cancelAnimationFrame = id => clearTimeout(id)

// ── Загрузка собранного скина через тот же контракт, что у dsh ──
let dispose = null
window.__ModuleLoader__ = { load({ factory }) {
  const exp = factory(() => ({}))
  exp.apply({ effect(fn) { dispose = fn() } })
} }
</script>
<script src="client.js"></script>
<script>
// ── Тесты ──
const results = []
const tick = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 60)))
const wait = ms => new Promise(r => setTimeout(r, ms))
const $ = s => document.querySelector(s)
const vis = el => !!el && getComputedStyle(el).display !== 'none' && el.getBoundingClientRect().width > 0
const rect = el => el.getBoundingClientRect()
const overlap = (a, b) => !(a.right <= b.left || b.right <= a.left || a.bottom <= b.top || b.bottom <= a.top)
function check(name, ok, info = '') { results.push({ name, ok: !!ok, info }) }
const body = document.body
const burger = () => $('[data-poh-mobile-burger]')

window.runTests = async function () {
  results.length = 0
  await tick()
  const W = innerWidth
  check('viewport мобильный (≤768)', W <= 768, `innerWidth=${W}`)
  check('meta viewport: без зума + resizes-content',
    /maximum-scale=1/.test($('meta[name=viewport]').content) && /interactive-widget=resizes-content/.test($('meta[name=viewport]').content))
  check('PWA meta apple-mobile-web-app-capable', !!$('meta[name="apple-mobile-web-app-capable"]'))
  check('центр на всю ширину (не 0px)', rect($('.pI_x6G_centerCol')).width >= W - 1, `center=${rect($('.pI_x6G_centerCol')).width}`)
  check('нет горизонтального скролла документа', document.documentElement.scrollWidth <= W, `scrollWidth=${document.documentElement.scrollWidth}`)
  check('поле ввода шрифт ≥16px (без iOS-зума)', parseFloat(getComputedStyle($('[data-composer-input]')).fontSize) >= 16)
  check('бургер виден на главном экране', vis(burger()))
  const hr = rect($('.pXSMma_headline')), er = rect($('[data-composer-input]'))
  check('hero: поле ввода ниже приветствия и у низа экрана', er.top > hr.bottom && er.bottom > innerHeight * 0.75, `headline.bottom=${hr.bottom|0} editor.bottom=${er.bottom|0}`)

  // drawer
  burger().click(); await tick(); await wait(350) // transition .25s
  check('бургер раскрывает сайдбар dsh (нативный toggle)', !frame.hasAttribute('data-sidebar-collapsed') && nativeToggleClicks === 1)
  check('drawer выехал (data-open, x=0)', $('.pI_x6G_sidebarCol').getAttribute('data-open') === 'true' && Math.abs(rect($('.pI_x6G_sidebarCol')).left) < 1)
  const fa = rect($('.hHd-Xa_footerActions')), ra = rect($('.hHd-Xa_regionArea')), sa = rect($('.hHd-Xa_settingsArea'))
  check('порядок: плагины → чаты → настройки', fa.top < ra.top && ra.top < sa.top, `plugins=${fa.top|0} chats=${ra.top|0} settings=${sa.top|0}`)
  $('#wsGroup').click(); await tick()
  check('раскрытие группы (aria-expanded) не закрывает drawer', !frame.hasAttribute('data-sidebar-collapsed'))
  $('#wsSearch').click(); await tick()
  check('поиск в шапке Workspaces не закрывает drawer', !frame.hasAttribute('data-sidebar-collapsed'))
  $('[data-session-link="s2"]').click(); await tick()
  check('выбор чата закрывает drawer', frame.hasAttribute('data-sidebar-collapsed') && !body.hasAttribute('data-poh-drawer'))
  for (const id of ['bft', 'comm']) {
    burger().click(); await tick()
    $(`[data-plugin-btn="${id}"]`).click(); await tick()
    check(`кнопка плагина «${id}» закрывает drawer`, frame.hasAttribute('data-sidebar-collapsed'))
  }
  burger().click(); await tick()
  $('#newSession').click(); await tick()
  check('«Новая сессия» закрывает drawer', frame.hasAttribute('data-sidebar-collapsed'))
  burger().click(); await tick()
  const portalMenu = document.createElement('button'); portalMenu.textContent = 'menu item'; document.body.appendChild(portalMenu)
  let portalClicked = false; portalMenu.onclick = () => { portalClicked = true }
  portalMenu.click(); await tick()
  check('тап по всплывающему меню (портал) не глушится и не закрывает drawer', portalClicked && !frame.hasAttribute('data-sidebar-collapsed'))
  portalMenu.remove()
  burger().click(); await tick() // закрыть
  burger().click(); await tick()
  $('#openSettings').click(); await tick()
  check('Settings из меню закрывает drawer', frame.hasAttribute('data-sidebar-collapsed'))
  $('.VOzbGW_close').click(); await tick()
  burger().click(); await tick()
  $('.pI_x6G_centerCol').dispatchEvent(new MouseEvent('click', { bubbles: true })); await tick()
  check('тап по scrim закрывает drawer', frame.hasAttribute('data-sidebar-collapsed'))

  // настройки
  burger().click(); await tick()
  $('#openSettings').click(); await tick()
  check('настройки: режим list', body.getAttribute('data-poh-settings') === 'list')
  check('настройки: бургер скрыт', !vis(burger()))
  check('настройки: панель на весь экран', Math.abs(rect($('.VOzbGW_panel')).width - W) < 1, `panel=${rect($('.VOzbGW_panel')).width}`)
  check('list: разделы на всю ширину, содержимое скрыто', rect($('.VOzbGW_nav')).width >= W - 1 && !vis($('.VOzbGW_options')))
  check('list: крестик виден', vis($('.VOzbGW_close')))
  check('list: крестик не перекрывает заголовок', !overlap(rect($('.VOzbGW_close')), rect($('.VOzbGW_navTitle').firstChild ? (() => { const r = document.createRange(); r.selectNodeContents($('.VOzbGW_navTitle')); return r })() : $('.VOzbGW_navTitle'))))

  for (const s of SECTIONS) {
    const cell = [...document.querySelectorAll('.VOzbGW_navCell')].find(c => c.dataset.id === s.id)
    cell.click(); await tick()
    const opts = $('.VOzbGW_options')
    const back = $('[data-poh-settings-bar] button'), close = $('.VOzbGW_close')
    const okView = body.getAttribute('data-poh-settings') === 'detail'
    const okSection = opts?.dataset.activeSection === s.id && vis(opts)
    const okTitle = $('[data-poh-settings-title]').textContent === s.label
    const okNavHidden = !vis($('.VOzbGW_nav'))
    const okBack = vis(back) && !overlap(rect(back), rect(close)) && !vis(burger())
    const okWidth = opts.scrollWidth <= opts.clientWidth + 1
    check(`«${s.label}»: открыт нужный раздел`, okView && okSection && okTitle && okNavHidden,
      `view=${body.getAttribute('data-poh-settings')} section=${opts?.dataset.activeSection} title=${$('[data-poh-settings-title]').textContent}`)
    check(`«${s.label}»: «Назад» виден, не перекрыт бургером/крестиком`, okBack)
    check(`«${s.label}»: без горизонтального переполнения`, okWidth, `scrollW=${opts.scrollWidth} clientW=${opts.clientWidth}`)
    back.click(); await tick()
    check(`«${s.label}»: «Назад» возвращает к списку`, body.getAttribute('data-poh-settings') === 'list' && vis($('.VOzbGW_nav')))
  }
  $('.VOzbGW_close').click(); await tick()
  check('закрытие настроек: атрибуты сняты, бургер вернулся', !body.hasAttribute('data-poh-settings') && vis(burger()))
  $('#openSettings').click(); await tick()
  check('повторное открытие начинается со списка', body.getAttribute('data-poh-settings') === 'list')
  $('.VOzbGW_close').click(); await tick()

  const fails = results.filter(r => !r.ok)
  $('#report').textContent = `${results.length - fails.length}/${results.length} passed\n` +
    results.map(r => `${r.ok ? '✔' : '✘'} ${r.name}${r.info ? '  [' + r.info + ']' : ''}`).join('\n')
  return { passed: results.length - fails.length, total: results.length, fails }
}

// ?autorun — прогнать сразу и показать отчёт внизу экрана.
// Переходы отключаем: в фоновой вкладке они замирают и дают ложные ✘.
if (new URLSearchParams(location.search).has('autorun')) {
  const s = document.createElement('style')
  s.textContent = '*{transition:none!important;animation:none!important}'
  document.head.appendChild(s)
  setTimeout(async () => { await runTests(); document.body.classList.add('show-report') }, 300)
}
</script>
</body>
</html>
